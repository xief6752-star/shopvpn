<script src="airports-data.js"></script>
<script>
// 获取 URL 参数
const id = new URLSearchParams(window.location.search).get('id');
const airport = AIRPORTS_DATA.find(a => a.id === id);

// 解锁服务映射
const UNLOCK_SERVICES = [
  { key: 'Netflix', icon: '🎬', label: 'Netflix' },
  { key: 'ChatGPT', icon: '🤖', label: 'ChatGPT' },
  { key: 'TikTok', icon: '🎵', label: 'TikTok' },
  { key: 'YouTube', icon: '▶️', label: 'YouTube' },
  { key: 'Disney', icon: '🏰', label: 'Disney+' },
  { key: 'Spotify', icon: '🎧', label: 'Spotify' },
  { key: 'OpenAI', icon: '🧠', label: 'OpenAI' },
  { key: 'Google', icon: '🔍', label: 'Google' },
];

function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5 ? 1 : 0;
  let html = '';
  for (let i = 0; i < full; i++) html += '<span class="star star-full">★</span>';
  if (half) html += '<span class="star star-half">★</span>';
  for (let i = full + half; i < 5; i++) html += '<span class="star star-empty">★</span>';
  return html + `<span class="rating-num">${rating}</span>`;
}

function getSpeedLevel(speed) {
  if (speed >= 800) return { label: '极速', color: '#15965b' };
  if (speed >= 500) return { label: '高速', color: '#1677ff' };
  if (speed >= 200) return { label: '正常', color: '#f59e0b' };
  return { label: '偏慢', color: '#ef4444' };
}

function getLatencyLevel(latency) {
  if (latency <= 10) return { label: '极低', color: '#15965b' };
  if (latency <= 50) return { label: '低延迟', color: '#1677ff' };
  if (latency <= 100) return { label: '正常', color: '#f59e0b' };
  return { label: '偏高', color: '#ef4444' };
}

function getTierClass(tier) {
  return { '高端': 'tier-high', '中端': 'tier-mid', '入门': 'tier-low' }[tier] || 'tier-low';
}

if (!airport) {
  document.querySelector('.review-page').innerHTML = `
    <div style="text-align:center;padding:100px 20px;">
      <h2 style="color:var(--muted)">未找到该机场</h2>
      <a href="airports.html" style="color:var(--blue);font-weight:600">返回机场列表</a>
    </div>`;
} else {
  // 页面标题
  document.getElementById('pageTitle').textContent = `${airport.name} 评测 · mapforvpn`;
  document.getElementById('breadcrumbName').textContent = airport.name;

  // 头部
  document.getElementById('reviewIcon').textContent = airport.icon;
  document.getElementById('airportName').textContent = airport.name;
  const tierEl = document.getElementById('airportTier');
  tierEl.textContent = airport.tier;
  tierEl.className = `review-tier ${getTierClass(airport.tier)}`;
  document.getElementById('airportRating').innerHTML = renderStars(airport.rating);
  document.getElementById('airportDesc').textContent = airport.description;
  document.getElementById('airportStatus').innerHTML =
    `<span class="status-badge ${airport.status === '正常运营' ? 'status-ok' : 'status-warn'}">● ${airport.status}</span>`;

  // 速度测试
  const speedLevel = getSpeedLevel(airport.avgSpeed);
  const latencyLevel = getLatencyLevel(airport.avgLatency);
  document.getElementById('avgSpeed').innerHTML =
    `<span style="color:${speedLevel.color}">${airport.avgSpeed}</span><small> ${speedLevel.label}</small>`;
  document.getElementById('avgLatency').innerHTML =
    `<span style="color:${latencyLevel.color}">${airport.avgLatency}</span><small> ${latencyLevel.label}</small>`;
  document.getElementById('stability').innerHTML =
    `<span style="color:${airport.stability >= 99 ? '#15965b' : airport.stability >= 97 ? '#1677ff' : '#f59e0b'}">${airport.stability}</span>`;
  document.getElementById('deviceCount').textContent = airport.devices || '-';

  // 功能特性
  document.getElementById('featuresList').innerHTML = (airport.features || []).map(f =>
    `<span class="feature-tag">${f}</span>`
  ).join('');

  // 新功能
  if (airport.newFeatures && airport.newFeatures.length > 0) {
    document.getElementById('newFeaturesSection').style.display = '';
    document.getElementById('newFeaturesList').innerHTML = airport.newFeatures.map(nf => `
      <div class="new-feature-item">
        <div class="new-feature-title">🆕 ${nf.title}</div>
        <div class="new-feature-desc">${nf.desc}</div>
        ${nf.steps ? `<ol class="new-feature-steps">${nf.steps.map((s, i) => `<li><span class="step-num">${i+1}</span>${s}</li>`).join('')}</ol>` : ''}
      </div>
    `).join('');
  }

  // 协议
  document.getElementById('protocolList').innerHTML = (airport.protocols || []).map(p =>
    `<span class="protocol-tag">${p}</span>`
  ).join('');

  // 套餐价格
  const prices = airport.price || {};
  document.getElementById('priceCards').innerHTML = [
    { label: '月付', value: prices.monthly, unit: '元/月' },
    { label: '季付', value: prices.quarterly, unit: '元/季' },
    { label: '年付', value: prices.yearly, unit: '元/年' },
  ].filter(p => p.value).map(p =>
    `<div class="price-card">
      <div class="price-card-label">${p.label}</div>
      <div class="price-card-value">¥${p.value}</div>
      <div class="price-card-unit">${p.unit}</div>
    </div>`
  ).join('');
  document.getElementById('trafficInfo').textContent = `流量：${airport.traffic || '-'}`;

  // 优缺点（根据数据自动生成）
  const pros = [...(airport.features || [])];
  if (airport.stability >= 99) pros.push('稳定性极高（' + airport.stability + '%）');
  if (airport.avgLatency <= 15) pros.push('超低延迟（' + airport.avgLatency + 'ms）');
  if (airport.avgSpeed >= 800) pros.push('顶级速度（' + airport.avgSpeed + 'Mbps）');
  const cons = [];
  if ((airport.price || {}).monthly > 20) cons.push('价格偏高，适合对品质有要求的用户');
  if (airport.status !== '正常运营') cons.push('当前状态：' + airport.status);
  cons.push('节点质量因地区而异，建议先试用');
  cons.push('请通过官方渠道注册，谨防山寨网站');

  document.getElementById('prosList').innerHTML = pros.map(p => `<li>${p}</li>`).join('');
  document.getElementById('consList').innerHTML = cons.map(c => `<li>${c}</li>`).join('');

  // 注册按钮
  document.getElementById('registerPrice').textContent = (airport.price || {}).monthly || '-';
  document.getElementById('registerTraffic').textContent = airport.traffic || '';
  const btn = document.getElementById('registerBtn');
  btn.href = airport.affUrl || '#';
  if (airport.promoCode) {
    document.getElementById('registerPromo').innerHTML =
      `<span class="promo-code">优惠码：<strong>${airport.promoCode}</strong></span>`;
  }

  // 标签
  document.getElementById('tagList').innerHTML = (airport.tags || []).map(t =>
    `<span class="airport-tag-item">${t}</span>`
  ).join('');
}

function bookmarkSite() {
  var url = window.location.href;
  var title = document.title;
  if (window.sidebar && window.sidebar.addPanel) {
    window.sidebar.addPanel(title, url, '');
  } else if (window.external && ('AddFavorite' in window.external)) {
    window.external.AddFavorite(url, title);
  } else {
    alert('请按 ' + (navigator.userAgent.toLowerCase().indexOf('mac') !== -1 ? 'Command/Cmd' : 'Ctrl') + '+D 收藏本站');
  }
}
</script>
